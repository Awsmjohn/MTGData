<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Codex — A Magic Card Archive</title>
<link rel="stylesheet" href="css/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div id="auth-root"></div>

<div id="app-root" style="display:none;">
<header class="cabinet-header">
  <h1>Codex</h1>
  <div class="tagline">a card catalog for a Magic collection</div>
  <div id="account-bar" class="account-bar"></div>
</header>

<nav class="drawer-tabs" id="tabs">
  <button class="drawer-tab active" data-tab="collection">Collection</button>
  <button class="drawer-tab" data-tab="decks">Decks</button>
  <button class="drawer-tab" data-tab="assistant">Assistant</button>
  <button class="drawer-tab" data-tab="storage">Storage Map</button>
  <button class="drawer-tab" data-tab="sharing">Sharing</button>
  <button class="drawer-tab" data-tab="io">Import · Export</button>
</nav>

<main class="drawer-body" id="drawer-body">
  <!-- populated by app.js -->
</main>
</div>

<div id="modal-root"></div>
<div id="print-area"></div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
